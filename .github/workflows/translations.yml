name: Translation validation and previews
on:
  pull_request:
    paths:
      - 'src/frontend/**'
      - 'src/backend/**'
      - 'scripts/translations.py'
      - '.github/workflows/translations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - run: uv sync --locked --extra gui --group dev
      - run: uv run --no-sync python scripts/translations.py check
  preview:
    # Manual dispatch on the reviewed translation branch. Windows uses the signing environment.
    if: github.event_name == 'workflow_dispatch'
    needs: catalogs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    environment: ${{ matrix.os == 'windows-2022' && 'signing' || 'build' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - run: uv sync --locked --extra gui --group dev
      - run: uv run --no-sync python scripts/patch_qtasyncio.py .venv
      - run: uv run --no-sync python scripts/translations.py build
      - name: Build desktop preview
        shell: bash
        run: >-
          uv run --no-sync --with pyinstaller pyinstaller
          --noconfirm --onedir --windowed --name PornFetch-translation-preview
          --collect-all PySide6 --collect-all certifi --collect-all curl_cffi
          --collect-submodules src --add-data "src:src" --add-data "docs:docs"
          --add-data "LICENSE:." --add-data "LICENSES:LICENSES"
          --add-data "THIRD_PARTY_NOTICES.md:." main.py
      - name: Set up Windows code signing
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-signing
      - name: Sign Windows preview and native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: ./packaging/sign_windows.ps1 -Paths 'dist/PornFetch-translation-preview'
      - uses: actions/upload-artifact@v4
        with:
          name: translation-preview-${{ matrix.os }}
          path: dist/
          retention-days: 14
      - name: Remove Windows signing session
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'pornfetch-signing') -Recurse -Force -ErrorAction SilentlyContinue
