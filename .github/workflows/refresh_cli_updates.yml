name: Refresh Update Metadata

on:
  schedule:
    - cron: "19 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    strategy:
      fail-fast: false
      matrix:
        kind: [cli, android, desktop]
    runs-on: ubuntu-24.04
    environment: beta
    concurrency:
      group: ${{ matrix.kind == 'cli' && 'cli-update-deploy' || matrix.kind == 'android' && 'website-release-deploy' || 'ifw-repository-deploy' }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install publishing dependencies
        run: uv sync --upgrade --no-dev

      - name: Refresh signed metadata
        shell: bash
        env:
          CLI_UPDATE_SIGNING_KEY: ${{ secrets.CLI_UPDATE_SIGNING_KEY }}
          WEBSITE_RELEASE_TOKEN: ${{ secrets.WEBSITE_RELEASE_TOKEN }}
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
          UPDATE_KIND: ${{ matrix.kind }}
          WEBSITE_ORIGIN: ${{ vars.WEBSITE_ORIGIN || 'https://pornfetch.to' }}
        run: |
          set -euo pipefail
          test -n "$CLI_UPDATE_SIGNING_KEY"
          umask 077
          SIGNING_KEY_FILE=$(mktemp "$RUNNER_TEMP/cli-online.XXXXXX.pem")
          trap 'rm -f "$SIGNING_KEY_FILE"' EXIT
          printf '%s\n' "$CLI_UPDATE_SIGNING_KEY" > "$SIGNING_KEY_FILE"
          chmod 600 "$SIGNING_KEY_FILE"
          unset CLI_UPDATE_SIGNING_KEY
          for channel in stable beta legacy; do
            channel_args=(--channel "$channel")
            suffix="$channel/"
            if [ "$channel" = legacy ]; then
              channel_args=(--legacy-feed)
              suffix=""
            fi
            if [ "$UPDATE_KIND" = cli ]; then
            uv run --no-sync python packaging/publish_cli_updates.py \
              --remote-url "https://api.pornfetch.to/repo/cli/$suffix" \
              --output "cli_update_repository/$channel" \
              --private-key "$SIGNING_KEY_FILE" "${channel_args[@]}" --allow-empty
            fi
            if [ "$UPDATE_KIND" = android ] && [ -n "$WEBSITE_RELEASE_TOKEN" ]; then
              uv run --no-sync python packaging/publish_android_updates.py \
                --origin "$WEBSITE_ORIGIN" --private-key "$SIGNING_KEY_FILE" "${channel_args[@]}" --allow-empty
            fi
            desktop_args=()
            if [ "$channel" != legacy ]; then desktop_args=(--channel "$channel"); fi
            if [ "$UPDATE_KIND" = desktop ]; then
            uv run --no-sync python packaging/refresh_desktop_updates.py \
              --private-key "$SIGNING_KEY_FILE" "${desktop_args[@]}"
            fi
          done

      - name: Publish refreshed metadata
        if: matrix.kind == 'cli'
        shell: bash
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          set -euo pipefail
          for channel in stable beta legacy; do
            if [ ! -f "cli_update_repository/$channel/metadata/timestamp.json" ]; then continue; fi
            selected="$channel"
            suffix="$channel/"
            if [ "$channel" = legacy ]; then selected=""; suffix=""; fi
            bash scripts/deploy_cli_updates.sh "cli_update_repository/$channel" "$selected"
            uv run --no-sync python packaging/verify_deployment.py cli \
              --repository "cli_update_repository/$channel" --remote-url "https://api.pornfetch.to/repo/cli/$suffix"
          done
