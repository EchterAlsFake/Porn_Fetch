name: Cross-Platform Build Pipeline

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish artifacts as a GitHub Release"
        type: boolean
        default: false
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # ==========================================
  # 1. GUI BUILDS (PySide6)
  # ==========================================
  build-gui:
    name: GUI (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            os: ubuntu-24.04
          - platform: linux
            arch: arm64
            os: ubuntu-24.04-arm
          - platform: windows
            arch: x64
            os: windows-latest
          - platform: windows
            arch: arm64
            os: windows-11-arm
          - platform: macos
            arch: x64
            os: macos-15-intel # Intel
          - platform: macos
            arch: arm64
            os: macos-latest # Apple Silicon

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: ${{ (matrix.arch == 'arm64') && 'arm64' || 'x64' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --- Platform Specific Setup ---
      - name: Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libgl1-mesa-dev xvfb

      - name: Windows ARM64 OpenSSL (vcpkg)
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg $vcpkgRoot
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          & "$vcpkgRoot\vcpkg.exe" install openssl --triplet arm64-windows
          echo "OPENSSL_DIR=$(Join-Path $vcpkgRoot 'installed\arm64-windows')" >> $env:GITHUB_ENV

      # --- Build Process ---
      - name: Sync Dependencies
        run: uv sync --locked --no-dev --extra gui --extra build --extra av

      - name: Fix Cryptography DLLs (Windows ARM64)
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          # 1. Dynamically find where uv installed the cryptography package
          $cryptoPath = uv run python -c "import cryptography, os; print(os.path.dirname(cryptography.__file__))"
          
          # 2. Point to the bindings folder where _rust.pyd lives
          $dllTarget = Join-Path $cryptoPath "hazmat\bindings"
          
          # 3. Get the DLLs from our vcpkg OpenSSL installation
          $dllSource = Join-Path $env:OPENSSL_DIR "bin\*.dll"
          
          Write-Host "Injecting OpenSSL DLLs into $dllTarget so PyInstaller bundles them..."
          Copy-Item -Path $dllSource -Destination $dllTarget -Force

      - name: Fetch PocketBase
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "macos" ]; then
            mkdir -p "dist_pb"
            uv run python scripts/fetch_pocketbase.py --platform macos --arch ${{ matrix.arch }} --dest dist_pb
          else
            uv run python scripts/fetch_pocketbase.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --dest .
            if [ -f pocketbase ]; then
              uv run --no-sync python scripts/write_checksum.py pocketbase
            elif [ -f pocketbase.exe ]; then
              uv run --no-sync python scripts/write_checksum.py pocketbase.exe
            fi
          fi

      - name: Frontend Update
        shell: bash
        run: |
          bash src/frontend/update.sh
          uv run --no-sync scripts/patch.py

      - name: Build with pyside6-deploy
        shell: bash
        run: |
          SPEC_FILE="packaging/pysidedeploy_${{ matrix.platform }}.spec"
          uv run -- pyside6-deploy -c $SPEC_FILE -f -v
          
          # Universal Rename Logic
          EXT="${{ matrix.platform == 'windows' && '.exe' || matrix.platform == 'macos' && '.app' || '.bin' }}"
          OUTPUT_NAME="PornFetch_${{ matrix.platform }}_GUI_${{ matrix.arch }}$EXT"
          
          if [ "${{ matrix.platform }}" == "macos" ]; then
             echo "DMG_OUTPUT=PornFetch_macOS_GUI_${{ matrix.arch }}.dmg" >> $GITHUB_ENV
          else
             mv "Porn Fetch$EXT" "$OUTPUT_NAME"
             echo "BIN_OUTPUT=$OUTPUT_NAME" >> $GITHUB_ENV
          fi

      # --- Packaging & QA ---
      - name: macOS DMG Packaging
        if: matrix.platform == 'macos'
        run: |
          if [ -f dist_pb/pocketbase ]; then
            cp -p dist_pb/pocketbase "Porn Fetch.app/Contents/MacOS/"
            chmod +x "Porn Fetch.app/Contents/MacOS/pocketbase"
          fi
          uv run python scripts/patch_macos_bundle.py "Porn Fetch.app"
          codesign --force --deep --sign - "Porn Fetch.app"
          mkdir dist_dmg
          cp -pR "Porn Fetch.app" dist_dmg/
          ln -s /Applications dist_dmg/Applications
          hdiutil create -volname "PornFetch" -srcfolder dist_dmg -ov -format UDZO "$DMG_OUTPUT"

      - name: Smoke Test
        if: matrix.platform != 'macos' # UI tests on Mac CI are notoriously flaky
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "linux" ]; then
            xvfb-run ./"$BIN_OUTPUT" --version
          else
            ./"$BIN_OUTPUT" --version
          fi

      - name: Checksum & Summary
        shell: bash
        run: |
          FILE="${{ env.BIN_OUTPUT || env.DMG_OUTPUT }}"
          uv run --no-sync python scripts/write_checksum.py "$FILE"
          echo "### SHA256 Checksum ($FILE)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`$(cat $FILE.sha256)\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PornFetch_${{ matrix.platform }}_GUI_${{ matrix.arch }}
          path: |
            ${{ env.BIN_OUTPUT || env.DMG_OUTPUT }}
            ${{ env.BIN_OUTPUT || env.DMG_OUTPUT }}.sha256
            pocketbase*

  # ==========================================
  # 2. CLI BUILDS (Standard Cross-Platform)
  # ==========================================
  build-cli:
    name: CLI (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            os: ubuntu-latest
          - platform: linux
            arch: arm64
            os: ubuntu-24.04-arm
          - platform: windows
            arch: x64
            os: windows-latest
          - platform: windows
            arch: arm64
            os: windows-11-arm
          - platform: windows
            arch: x86
            os: windows-latest
          - platform: macos
            arch: x64
            os: macos-15-intel
          - platform: macos
            arch: arm64
            os: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: ${{ (matrix.arch == 'x86') && 'x86' || (matrix.arch == 'arm64') && 'arm64' || 'x64' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync Dependencies
        run: uv sync --locked --no-dev --extra build

      - name: Fetch PocketBase
        shell: bash
        run: |
          uv run python scripts/fetch_pocketbase.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --dest .
          if [ -f pocketbase ]; then
            uv run --no-sync python scripts/write_checksum.py pocketbase
          elif [ -f pocketbase.exe ]; then
            uv run --no-sync python scripts/write_checksum.py pocketbase.exe
          fi

      - name: Build
        shell: bash
        run: |
          uv run pyinstaller --clean packaging/pyinstaller_cli.spec
          
          EXT="${{ matrix.platform == 'windows' && '.exe' || '' }}"
          OUT="PornFetch_${{ matrix.platform }}_CLI_${{ matrix.arch }}$EXT"
          mv dist/Porn_Fetch_CLI$EXT "$OUT"
          echo "CLI_OUTPUT=$OUT" >> $GITHUB_ENV
          uv run --no-sync python scripts/write_checksum.py "$OUT"

      - name: Test CLI
        shell: bash
        run: |
          ./${{ env.CLI_OUTPUT }} --test-mode --filter offline

      - name: Checksum & Summary
        shell: bash
        run: |
          echo "### SHA256 Checksum (${{ env.CLI_OUTPUT }})" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`$(cat ${{ env.CLI_OUTPUT }}.sha256)\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PornFetch_${{ matrix.platform }}_CLI_${{ matrix.arch }}
          path: |
            PornFetch_*
            pocketbase*

  # ==========================================
  # 3. CLI BUILD (Linux 32-bit - The Special Case)
  # ==========================================
  build-cli-linux-x32:
    name: CLI experimental (linux-x32)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Build 32-bit Python & Binary
        env:
          PY_VER: "3.14.0"
          PREFIX: "/opt/python-32"
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib libffi-dev:i386 zlib1g-dev:i386 libssl-dev:i386

          wget https://www.python.org/ftp/python/$PY_VER/Python-$PY_VER.tgz
          tar -xzf Python-$PY_VER.tgz && cd Python-$PY_VER
          CC="gcc -m32" LDFLAGS="-m32" ./configure --prefix=$PREFIX --enable-shared
          make -j$(nproc) && sudo make altinstall
          cd ..

          export PATH="$PREFIX/bin:$PATH"
          export LD_LIBRARY_PATH="$PREFIX/lib"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv .venv --python $PREFIX/bin/python3.14
          source .venv/bin/activate
          CC="gcc -m32" LDFLAGS="-m32" uv pip install --no-binary=:all: pyinstaller
          uv sync --locked --no-dev --extra build
          python -m PyInstaller --clean packaging/pyinstaller_cli.spec

          mv dist/Porn_Fetch_CLI PornFetch_Linux_CLI_x32
          echo "CLI_OUTPUT=PornFetch_Linux_CLI_x32" >> $GITHUB_ENV
          python scripts/write_checksum.py PornFetch_Linux_CLI_x32

      - name: Test CLI
        shell: bash
        run: |
          ./${{ env.CLI_OUTPUT }} --test-mode --filter offline

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PornFetch_Linux_CLI_x32
          path: |
            PornFetch_Linux_CLI_x32
            PornFetch_Linux_CLI_x32.sha256

  # ==========================================
  # 4. EXOTIC ARCHITECTURE CLI BUILDS (QEMU)
  # ==========================================
  build-exotic-cli:
    name: CLI experimental (linux-${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false  # Prevent one failing architecture from killing the others
      matrix:
        arch: [riscv64, s390x, ppc64le]
    steps:
      - uses: actions/checkout@v7

      - name: Build via QEMU
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu24.04
          run: |
            # 1. Update and install standard Python tools
            apt-get update
            apt-get install -y python3-venv python3-pip python3-dev build-essential
            
            # 2. Create and activate a Virtual Environment to bypass PEP 668
            python3 -m venv /opt/venv
            export PATH="/opt/venv/bin:$PATH"
            
            # 3. Install dependencies ignoring python-version bounds for runner distro python
            pip install --ignore-requires-python '.[build]'
            
            # 4. Build the binary
            pyinstaller --clean packaging/pyinstaller_cli.spec
            
            # 5. Rename output and test
            mv dist/Porn_Fetch_CLI PornFetch_Linux_CLI_${{ matrix.arch }}
            ./PornFetch_Linux_CLI_${{ matrix.arch }} --test-mode --filter offline

      - name: Checksum & Upload
        run: |
          python3 scripts/write_checksum.py PornFetch_Linux_CLI_${{ matrix.arch }}
          
          echo "### SHA256 Checksum (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat PornFetch_Linux_CLI_${{ matrix.arch }}.sha256 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PornFetch_Linux_CLI_${{ matrix.arch }}
          path: |
            PornFetch_Linux_CLI_${{ matrix.arch }}
            PornFetch_Linux_CLI_${{ matrix.arch }}.sha256

  # ==========================================
  # 5. MACOS UNIVERSAL BINARY (FUSION)
  # ==========================================
  build-macos-universal:
    name: GUI (macos-universal)
    needs: build-gui  # Wait for the x64 and arm64 builds to finish
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync Dependencies
        run: uv sync --locked --no-dev --extra gui --extra build --extra av

      # 1. Download the artifacts we just built
      - name: Download macOS x64 DMG
        uses: actions/download-artifact@v4
        with:
          name: PornFetch_macos_GUI_x64
          path: dmg_x64

      - name: Download macOS arm64 DMG
        uses: actions/download-artifact@v4
        with:
          name: PornFetch_macos_GUI_arm64
          path: dmg_arm64

      # 2. Extract, Fuse, and Repackage
      - name: Create Universal Binary
        shell: bash
        run: |
          # Mount DMGs and extract the .app bundles
          hdiutil attach dmg_x64/PornFetch_macOS_GUI_x64.dmg -mountpoint /Volumes/x64_dmg
          cp -pR "/Volumes/x64_dmg/Porn Fetch.app" "PornFetch_x64.app"
          hdiutil detach /Volumes/x64_dmg
          
          hdiutil attach dmg_arm64/PornFetch_macOS_GUI_arm64.dmg -mountpoint /Volumes/arm64_dmg
          cp -pR "/Volumes/arm64_dmg/Porn Fetch.app" "PornFetch_arm64.app"
          hdiutil detach /Volumes/arm64_dmg
          
          # Use the x64 app as the base framework for our Universal app
          cp -pR "PornFetch_x64.app" "PornFetch_Universal.app"
          
          # Iterate through every file in the arm64 app
          find "PornFetch_arm64.app" -type f -print0 | while IFS= read -r -d '' arm_file; do
              rel_path="${arm_file#PornFetch_arm64.app/}"
              x64_file="PornFetch_Universal.app/$rel_path"
          
              # Ensure the file exists in the x64 app too
              if [ -f "$x64_file" ]; then
                  # Check if BOTH files are compiled Mach-O binaries
                  if file "$arm_file" | grep -q "Mach-O" && file "$x64_file" | grep -q "Mach-O"; then
                      archs=$(lipo -archs "$x64_file")
          
                      # If the base file isn't ALREADY a fat binary, fuse them
                      if ! (echo "$archs" | grep -q "arm64" && echo "$archs" | grep -q "x86_64"); then
                          echo "Fusing: $rel_path"
                          lipo -create -output "$x64_file" "$x64_file" "$arm_file"
                      fi
                  fi
              fi
          done
          
          # Patch the bundle to correctly integrate the Sparkle framework for updates
          echo "Patching macOS bundle for Sparkle framework..."
          uv run python scripts/patch_macos_bundle.py "PornFetch_Universal.app"

          # Re-sign after changing binaries and Info.plist
          echo "Signing Universal App..."
          codesign --force --deep --sign - "PornFetch_Universal.app"
          
          # Package back into a final Universal DMG
          mkdir dist_dmg
          cp -pR "PornFetch_Universal.app" "dist_dmg/Porn Fetch.app"
          ln -s /Applications dist_dmg/Applications
          hdiutil create -volname "PornFetch" -srcfolder dist_dmg -ov -format UDZO "PornFetch_macOS_GUI_Universal.dmg"

      # 3. Standard QA and Upload
      - name: Checksum & Summary
        run: |
          uv run --no-sync python scripts/write_checksum.py PornFetch_macOS_GUI_Universal.dmg
          echo "### SHA256 Checksum (macOS Universal)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat PornFetch_macOS_GUI_Universal.dmg.sha256 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Universal Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PornFetch_macOS_GUI_Universal
          path: |
            PornFetch_macOS_GUI_Universal.dmg
            PornFetch_macOS_GUI_Universal.dmg.sha256

  # ==========================================
  # 6. PUBLISH RELEASE (TAGS & DISPATCH)
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-gui, build-cli, build-macos-universal]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p dist_release
          find all_artifacts -type f -exec cp {} dist_release/ \;
          echo "### Collected Release Assets:"
          ls -lh dist_release/

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            gh release create "$TAG_NAME" dist_release/* \
              --title "Porn Fetch $TAG_NAME" \
              --generate-notes \
              --verify-tag
          else
            RELEASE_TAG="build-${{ github.sha }}"
            gh release create "$RELEASE_TAG" dist_release/* \
              --title "Porn Fetch Build (${{ github.sha }})" \
              --notes "Automated build release triggered via workflow dispatch." \
              --draft=false
          fi
