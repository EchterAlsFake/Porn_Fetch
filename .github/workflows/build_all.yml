name: Cross-Platform Build Pipeline
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: github-release-3.8.91-recovery
  cancel-in-progress: false
jobs:
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3046ce6b12f0799f14ab329199f2ad104e170323
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.2'
      - name: Reuse successful original platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 42053364458
          pattern: PornFetch_*
          path: release_artifacts
      - name: Reuse corrected iOS artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 42093846060
          pattern: PornFetch_ios_GUI_*
          path: release_artifacts
      - name: Prepare the same packages as the verified website release
        env:
          RELEASE_TIMESTAMP: '1793891815'
        run: |
          python packaging/write_build_version.py 3.8.91 --release-timestamp "$RELEASE_TIMESTAMP"
          python packaging/publish_website_release.py --dry-run \
            --artifacts release_artifacts --output dist_release --source-root . \
            --version 3.8.91 --channel beta --timestamp "$RELEASE_TIMESTAMP" \
            --commit 3046ce6b12f0799f14ab329199f2ad104e170323 --notes CHANGELOG_STATIC.md
          python - <<'PYCODE'
          import json, urllib.request
          from pathlib import Path
          local = json.loads(Path("dist_release/manifest.json").read_text())
          with urllib.request.urlopen("https://pornfetch.to/download/catalog.json?version=3.8.91", timeout=30) as response:
              remote = next(r for r in json.load(response)["releases"] if r["version"] == "3.8.91")
          assert remote["commit"] == local["commit"]
          assert remote["published_at"] == local["published_at"]
          expected = {a["filename"]: (a["sha256"], a["size"]) for a in remote["artifacts"]}
          actual = {a["filename"]: (a["sha256"], a["size"]) for a in local["artifacts"]}
          assert actual == expected, "Packages differ from verified website release"
          sums = "".join(f"{digest}  {name}\n" for name, (digest, _) in sorted(actual.items()))
          Path("dist_release/SHA256SUMS").write_text(sums)
          for name, (digest, _) in actual.items():
              Path("dist_release", name + ".sha256").write_text(f"{digest}  {name}\n")
          print(f"Verified {len(actual)} packages against the published website checksums.")
          PYCODE
      - name: Publish verified GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.8.91 dist_release/* --title 'Porn Fetch 3.8.91' \
            --notes-file CHANGELOG_STATIC.md --prerelease \
            --target 3046ce6b12f0799f14ab329199f2ad104e170323 --draft=false
