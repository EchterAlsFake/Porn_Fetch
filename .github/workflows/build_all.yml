name: Cross-Platform Build Pipeline

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish artifacts as a GitHub Release"
        type: boolean
        default: false
      legal_review_complete:
        description: "Confirm application license, dependency, asset, and EU terms review is complete"
        type: boolean
        default: false
      deploy_repositories:
        description: "Upload Qt IFW repositories to the configured beta server"
        type: boolean
        default: false
      deploy_cli_updates:
        description: "Publish signed CLI update bundles to the beta server"
        type: boolean
        default: false
      experimental_builds:
        description: "Also build Linux 32-bit and RISC-V CLI artifacts"
        type: boolean
        default: false
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  # Publishing runs have their own queue and cannot be cancelled by another build.
  group: builds-${{ github.ref }}-${{ (inputs.create_release || inputs.deploy_repositories || inputs.deploy_cli_updates) && 'publish' || 'build' }}
  cancel-in-progress: ${{ !(inputs.create_release || inputs.deploy_repositories || inputs.deploy_cli_updates) }}

env:
  PYTHONUNBUFFERED: "1"
  UV_NO_SYNC: "1"

jobs:
  validate:
    name: Validate build commit
    uses: ./.github/workflows/ci.yml

  # ==========================================
  # 1. GUI BUILDS (PySide6)
  # ==========================================
  build-gui:
    needs: validate
    name: GUI (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            os: ubuntu-24.04
          - platform: linux
            arch: arm64
            os: ubuntu-24.04-arm
          - platform: windows
            arch: x64
            os: windows-latest
          - platform: macos
            arch: x64
            os: macos-15-intel # Intel
          - platform: macos
            arch: arm64
            os: macos-latest # Apple Silicon

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          architecture: ${{ (matrix.arch == 'arm64') && 'arm64' || 'x64' }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      # --- Platform Specific Setup ---
      - name: Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip libegl1 libgles2 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libgl1-mesa-dev xvfb

      # --- Build Process ---
      - name: Sync Dependencies
        run: uv sync --locked --no-dev --extra gui --extra build --extra desktop-build --extra av

      - name: Fetch PocketBase
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "macos" ]; then
            mkdir -p "dist_pb"
            uv run python scripts/fetch_pocketbase.py --platform macos --arch ${{ matrix.arch }} --dest dist_pb
          else
            uv run python scripts/fetch_pocketbase.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --dest .
            if [ "${{ matrix.platform }}" = "windows" ] && [ -f pocketbase.exe ]; then
              uv run --no-sync python scripts/write_checksum.py pocketbase.exe
            elif [ -f pocketbase ]; then
              uv run --no-sync python scripts/write_checksum.py pocketbase
            fi
          fi

      - name: Frontend Update
        shell: bash
        run: |
          bash src/frontend/update.sh
          uv run --no-sync scripts/patch.py

      - name: Embed immutable release and artifact version
        run: uv run --no-sync python packaging/write_build_version.py ${{ github.run_number }}

      - name: Apply and verify required QtAsyncio compatibility patch
        run: |
          uv run --no-sync python scripts/patch_qtasyncio.py .venv
          uv run --no-sync python scripts/patch_qtasyncio.py .venv --verify

      - name: Build with pyside6-deploy
        shell: bash
        run: |
          SPEC_FILE="packaging/pysidedeploy_${{ matrix.platform }}.spec"
          NUITKA_VERSION=$(uv run --no-sync python -c 'from importlib.metadata import version; print(version("Nuitka"))')
          uv run --no-sync -- pyside6-deploy -c "$SPEC_FILE" -f -v --keep-deployment-files --nuitka-version "$NUITKA_VERSION"
          
          # Universal Rename Logic
          EXT="${{ matrix.platform == 'windows' && '.exe' || matrix.platform == 'macos' && '.app' || '.bin' }}"
          OUTPUT_NAME="PornFetch_${{ matrix.platform }}_GUI_${{ matrix.arch }}$EXT"
          
          if [ "${{ matrix.platform }}" = "macos" ]; then
             echo "DMG_OUTPUT=PornFetch_macOS_GUI_${{ matrix.arch }}.dmg" >> "$GITHUB_ENV"
          else
             mv "Porn Fetch$EXT" "$OUTPUT_NAME"
             echo "BIN_OUTPUT=$OUTPUT_NAME" >> "$GITHUB_ENV"
          fi

      # --- Packaging & QA ---
      - name: macOS DMG Packaging
        if: matrix.platform == 'macos'
        run: |
          if [ -f dist_pb/pocketbase ]; then
            cp -p dist_pb/pocketbase "Porn Fetch.app/Contents/MacOS/"
            chmod +x "Porn Fetch.app/Contents/MacOS/pocketbase"
          fi
          codesign --force --deep --sign - "Porn Fetch.app"
          mkdir dist_dmg
          cp -pR "Porn Fetch.app" dist_dmg/
          ln -s /Applications dist_dmg/Applications
          hdiutil create -volname "PornFetch" -srcfolder dist_dmg -ov -format UDZO "$DMG_OUTPUT"

      - name: Smoke Test
        shell: bash
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          if [ "${{ matrix.platform }}" == "macos" ]; then
            EXECUTABLE=$(uv run --no-sync python -c 'import plistlib; print(plistlib.load(open("Porn Fetch.app/Contents/Info.plist", "rb"))["CFBundleExecutable"])')
            "Porn Fetch.app/Contents/MacOS/$EXECUTABLE" --smoke-test
          else
            ./"$BIN_OUTPUT" --smoke-test
          fi

      - name: Checksum & Summary
        shell: bash
        run: |
          FILE="${{ env.BIN_OUTPUT || env.DMG_OUTPUT }}"
          uv run --no-sync python scripts/write_checksum.py "$FILE"
          echo "### SHA256 Checksum ($FILE)" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`$(cat "$FILE.sha256")\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect legal notices
        run: uv run --no-sync python packaging/collect_legal.py PornFetch_${{ matrix.platform }}_GUI_${{ matrix.arch }}_LEGAL

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PornFetch_${{ matrix.platform }}_GUI_${{ matrix.arch }}
          path: |
            ${{ env.BIN_OUTPUT || env.DMG_OUTPUT }}
            ${{ env.BIN_OUTPUT || env.DMG_OUTPUT }}.sha256
            pocketbase*
            PornFetch_${{ matrix.platform }}_GUI_${{ matrix.arch }}_LEGAL.zip

      - name: Install 7-Zip on macOS for IFW
        if: matrix.platform == 'macos'
        shell: bash
        run: command -v 7z || command -v 7zz || brew install sevenzip

      - name: Install Qt Installer Framework 4.11
        if: matrix.arch == 'x64' || matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          IFW_BIN=$(uv run --no-sync python packaging/install_ifw.py \
            --platform ${{ matrix.platform }} --dest "$RUNNER_TEMP/qt-ifw" | tail -n 1)
          echo "$IFW_BIN" >> "$GITHUB_PATH"

      - name: Build IFW installer and repository
        if: matrix.arch == 'x64' || matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ifw_payload ifw_output/installers
          IFW_OS="${{ matrix.platform }}"
          IFW_ARCH="${{ matrix.arch }}"
          if [ "$IFW_OS" = "macos" ]; then
            IFW_OS="darwin"
            cp -R "Porn Fetch.app" ifw_payload/
            POCKETBASE_BINARY="dist_pb/pocketbase"
            INSTALLER_EXT=".dmg"
          elif [ "$IFW_OS" = "windows" ]; then
            IFW_ARCH="amd64"
            cp "$BIN_OUTPUT" "ifw_payload/Porn Fetch.exe"
            POCKETBASE_BINARY="pocketbase.exe"
            INSTALLER_EXT=".exe"
          else
            IFW_ARCH="amd64"
            cp "$BIN_OUTPUT" "ifw_payload/Porn Fetch"
            cp src/frontend/graphics/logo_transparent.png ifw_payload/
            POCKETBASE_BINARY="pocketbase"
            INSTALLER_EXT=".run"
          fi
          if [ "$IFW_ARCH" = "x64" ]; then IFW_ARCH="amd64"; fi
          if [ "$IFW_ARCH" = "arm64" ]; then IFW_ARCH="arm64"; fi
          cp "PornFetch_${{ matrix.platform }}_GUI_${{ matrix.arch }}_LEGAL.zip" ifw_payload/
          REPO_TAG="${IFW_OS}_${IFW_ARCH}"
          INSTALLER="ifw_output/installers/PornFetch_${{ matrix.platform }}_GUI_${{ matrix.arch }}_Setup${INSTALLER_EXT}"
          APP_VERSION=$(uv run --no-sync python -c 'from src.shared.version import __version__; print(__version__)')
          uv run --no-sync python packaging/generate_repository.py \
            --dist-dir ifw_payload \
            --platform "$IFW_OS" --arch "$IFW_ARCH" \
            --pocketbase-binary "$POCKETBASE_BINARY" \
            --staging-dir "ifw_output/staging/$REPO_TAG" \
            --output-repo "ifw_output/repository/$REPO_TAG" \
            --output-installer "$INSTALLER" \
            --version "$APP_VERSION.${{ github.run_number }}"
          uv run --no-sync python scripts/write_checksum.py "$INSTALLER"

      - name: Upload IFW installer
        if: matrix.arch == 'x64' || matrix.platform == 'macos'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: IFW_installer_${{ matrix.platform }}_${{ matrix.arch }}
          path: ifw_output/installers/*
          if-no-files-found: error

      - name: Upload IFW repository
        if: matrix.arch == 'x64' || matrix.platform == 'macos'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: IFW_repo_${{ matrix.platform }}_${{ matrix.arch }}
          path: ifw_output/repository/
          if-no-files-found: error

      - name: Report CI Status
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status == 'success' && 'pass' || 'fail' }}"
          curl -f -sS -X POST \
            -H "X-CI-TOKEN: ${{ secrets.CI_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"$STATUS\",\"details\":\"Run #${{ github.run_number }}\"}" \
            https://api.pornfetch.to/ci/gui_build || true

  # ==========================================
  # 2. CLI BUILDS (Standard Cross-Platform)
  # ==========================================
  build-cli:
    needs: validate
    name: CLI (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            os: ubuntu-latest
          - platform: linux
            arch: arm64
            os: ubuntu-24.04-arm
          - platform: windows
            arch: x64
            os: windows-latest
          - platform: windows
            arch: arm64
            os: windows-11-arm
          - platform: macos
            arch: x64
            os: macos-15-intel
          - platform: macos
            arch: arm64
            os: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          architecture: ${{ (matrix.arch == 'x86') && 'x86' || (matrix.arch == 'arm64') && 'arm64' || 'x64' }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Windows ARM64 OpenSSL (vcpkg)
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg $vcpkgRoot
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          & "$vcpkgRoot\vcpkg.exe" install openssl --triplet arm64-windows
          echo "OPENSSL_DIR=$(Join-Path $vcpkgRoot 'installed\arm64-windows')" >> $env:GITHUB_ENV

      - name: Sync Dependencies
        run: uv sync --locked --no-dev --extra build

      - name: Include OpenSSL DLLs (Windows ARM64)
        if: matrix.platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $cryptoPath = uv run --no-sync python -c "import cryptography, os; print(os.path.dirname(cryptography.__file__))"
          $dllTarget = Join-Path $cryptoPath "hazmat\bindings"
          Copy-Item -Path (Join-Path $env:OPENSSL_DIR "bin\*.dll") -Destination $dllTarget -Force

      - name: Fetch PocketBase
        shell: bash
        run: |
          uv run --no-sync python scripts/fetch_pocketbase.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --dest .
          if [ "${{ matrix.platform }}" = "windows" ] && [ -f pocketbase.exe ]; then
            uv run --no-sync python scripts/write_checksum.py pocketbase.exe
          elif [ -f pocketbase ]; then
            uv run --no-sync python scripts/write_checksum.py pocketbase
          fi

      - name: Build
        shell: bash
        run: |
          uv run --no-sync python packaging/write_cli_build_version.py ${{ github.run_number }} ${{ matrix.platform }} ${{ matrix.arch }}
          uv run --no-sync pyinstaller --clean packaging/pyinstaller_cli.spec
          
          EXT="${{ matrix.platform == 'windows' && '.exe' || '' }}"
          OUT="PornFetch_${{ matrix.platform }}_CLI_${{ matrix.arch }}$EXT"
          mv "dist/Porn_Fetch_CLI$EXT" "$OUT"
          echo "CLI_OUTPUT=$OUT" >> "$GITHUB_ENV"
          uv run --no-sync python scripts/write_checksum.py "$OUT"

      - name: Test CLI
        shell: bash
        run: |
          ./${{ env.CLI_OUTPUT }} --test-mode --filter offline

      - name: Collect legal notices
        run: uv run --no-sync python packaging/collect_legal.py PornFetch_${{ matrix.platform }}_CLI_${{ matrix.arch }}_LEGAL

      - name: Checksum & Summary
        shell: bash
        run: |
          echo "### SHA256 Checksum (${{ env.CLI_OUTPUT }})" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`$(cat "${{ env.CLI_OUTPUT }}.sha256")\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PornFetch_${{ matrix.platform }}_CLI_${{ matrix.arch }}
          path: |
            ${{ env.CLI_OUTPUT }}
            ${{ env.CLI_OUTPUT }}.sha256
            pocketbase*
            PornFetch_${{ matrix.platform }}_CLI_${{ matrix.arch }}_LEGAL.zip

      - name: Report CI Status
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status == 'success' && 'pass' || 'fail' }}"
          curl -f -sS -X POST \
            -H "X-CI-TOKEN: ${{ secrets.CI_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"$STATUS\",\"details\":\"Run #${{ github.run_number }}\"}" \
            https://api.pornfetch.to/ci/cli_build || true

  # ==========================================
  # 3. LINUX 32-BIT CLI BUILD
  # ==========================================
  build-cli-linux-x32:
    needs: validate
    name: CLI experimental (linux-x32)
    if: github.event_name == 'workflow_dispatch' && inputs.experimental_builds
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and smoke test in 32-bit Linux
        run: |
          docker run --rm --platform linux/386 \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/workspace \
            --workdir /workspace \
            --env BUILD_RUN_NUMBER="${{ github.run_number }}" \
            debian:bookworm bash packaging/build_linux_x86.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PornFetch_Linux_CLI_x32
          path: |
            PornFetch_Linux_CLI_x32
            PornFetch_Linux_CLI_x32.sha256
            PornFetch_Linux_CLI_x32_LEGAL.zip
          if-no-files-found: error

  # ==========================================
  # 4. RISC-V CLI BUILD (QEMU)
  # ==========================================
  build-cli-linux-riscv64:
    needs: validate
    name: CLI experimental (linux-riscv64)
    if: github.event_name == 'workflow_dispatch' && inputs.experimental_builds
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and smoke test via QEMU
        uses: uraimo/run-on-arch-action@1e2c619f81e6d8609845ea1d2f443a778df1ac68 # v3
        with:
          arch: riscv64
          distro: ubuntu24.04
          run: |
            set -eu
            apt-get update
            apt-get install -y build-essential ca-certificates curl git libffi-dev libssl-dev pkg-config zlib1g-dev
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
            curl -fsSL https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
            export UV_NO_PROGRESS=1
            uv python install 3.14
            uv sync --locked --no-dev --extra build --python 3.14
            uv run --no-sync python packaging/write_cli_build_version.py ${{ github.run_number }} linux riscv64
            uv run --no-sync pyinstaller --clean packaging/pyinstaller_cli.spec
            readelf -h dist/Porn_Fetch_CLI | grep -q 'Machine:.*RISC-V'
            mv dist/Porn_Fetch_CLI PornFetch_Linux_CLI_riscv64
            ./PornFetch_Linux_CLI_riscv64 --test-mode --filter offline
            uv run --no-sync python scripts/write_checksum.py PornFetch_Linux_CLI_riscv64
            uv run --no-sync python packaging/collect_legal.py PornFetch_Linux_CLI_riscv64_LEGAL

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PornFetch_Linux_CLI_riscv64
          path: |
            PornFetch_Linux_CLI_riscv64
            PornFetch_Linux_CLI_riscv64.sha256
            PornFetch_Linux_CLI_riscv64_LEGAL.zip
          if-no-files-found: error

  # ==========================================
  # 5. MACOS UNIVERSAL BINARY (FUSION)
  # ==========================================
  build-macos-universal:
    name: GUI (macos-universal)
    needs: build-gui  # Wait for the x64 and arm64 builds to finish
    if: needs.build-gui.result == 'success'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Sync Dependencies
        run: uv sync --locked --no-dev --extra gui --extra build --extra av

      # 1. Download the artifacts we just built
      - name: Download macOS x64 DMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: PornFetch_macos_GUI_x64
          path: dmg_x64

      - name: Download macOS arm64 DMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: PornFetch_macos_GUI_arm64
          path: dmg_arm64

      # 2. Extract, Fuse, and Repackage
      - name: Create Universal Binary
        shell: bash
        run: |
          # Mount DMGs and extract the .app bundles
          hdiutil attach dmg_x64/PornFetch_macOS_GUI_x64.dmg -mountpoint /Volumes/x64_dmg
          cp -pR "/Volumes/x64_dmg/Porn Fetch.app" "PornFetch_x64.app"
          hdiutil detach /Volumes/x64_dmg
          
          hdiutil attach dmg_arm64/PornFetch_macOS_GUI_arm64.dmg -mountpoint /Volumes/arm64_dmg
          cp -pR "/Volumes/arm64_dmg/Porn Fetch.app" "PornFetch_arm64.app"
          hdiutil detach /Volumes/arm64_dmg
          
          uv run --no-sync python packaging/merge_macos_bundles.py \
            PornFetch_x64.app PornFetch_arm64.app PornFetch_Universal.app
          
          # Re-sign after changing Mach-O binaries
          echo "Signing Universal App..."
          codesign --force --deep --sign - "PornFetch_Universal.app"

          # Package back into a final Universal DMG
          mkdir dist_dmg
          cp -pR "PornFetch_Universal.app" "dist_dmg/Porn Fetch.app"
          ln -s /Applications dist_dmg/Applications
          hdiutil create -volname "PornFetch" -srcfolder dist_dmg -ov -format UDZO "PornFetch_macOS_GUI_Universal.dmg"

      - name: Smoke test both universal architectures
        shell: bash
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          EXECUTABLE=$(uv run --no-sync python -c 'import plistlib; print(plistlib.load(open("PornFetch_Universal.app/Contents/Info.plist", "rb"))["CFBundleExecutable"])')
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 "PornFetch_Universal.app/Contents/MacOS/$EXECUTABLE" --smoke-test
          /usr/bin/arch -arm64 "PornFetch_Universal.app/Contents/MacOS/$EXECUTABLE" --smoke-test

      # 3. Standard QA and Upload
      - name: Checksum & Summary
        run: |
          uv run --no-sync python scripts/write_checksum.py PornFetch_macOS_GUI_Universal.dmg
          {
            echo "### SHA256 Checksum (macOS Universal)"
            echo '```'
            cat PornFetch_macOS_GUI_Universal.dmg.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect legal notices
        run: uv run --no-sync python packaging/collect_legal.py PornFetch_macOS_GUI_Universal_LEGAL

      - name: Upload Universal Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PornFetch_macOS_GUI_Universal
          path: |
            PornFetch_macOS_GUI_Universal.dmg
            PornFetch_macOS_GUI_Universal.dmg.sha256
            PornFetch_macOS_GUI_Universal_LEGAL.zip

  # ==========================================
  # 6. DEPLOY QT INSTALLER FRAMEWORK REPOSITORIES
  # ==========================================
  deploy-repositories:
    name: Deploy IFW Repositories
    needs: [validate, build-gui]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.legal_review_complete &&
      (inputs.deploy_repositories || inputs.create_release)
    runs-on: ubuntu-latest
    environment: beta
    concurrency:
      group: ifw-repository-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install signing dependencies
        run: uv sync --locked --no-dev

      - name: Configure online signing key
        shell: bash
        env:
          CLI_UPDATE_SIGNING_KEY: ${{ secrets.CLI_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLI_UPDATE_SIGNING_KEY"
          umask 077
          printf '%s\n' "$CLI_UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/cli_online.pem"
          chmod 600 "$RUNNER_TEMP/cli_online.pem"

      - name: Download Built Repositories
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: IFW_repo_*
          path: dist/ifw_repo
          merge-multiple: true

      - name: Deploy Repositories
        shell: bash
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          set -euo pipefail
          APP_VERSION=$(uv run --no-sync python -c 'from src.shared.version import __version__; print(__version__)')
          for target in linux_amd64 windows_amd64 darwin_amd64 darwin_arm64; do
            test -f "dist/ifw_repo/$target/Updates.xml"
            uv run --no-sync python packaging/sign_desktop_release.py \
              --repository "dist/ifw_repo/$target" --platform "$target" \
              --version "$APP_VERSION.${{ github.run_number }}" \
              --private-key "$RUNNER_TEMP/cli_online.pem"
          done
          for target in linux_amd64 windows_amd64 darwin_amd64 darwin_arm64; do
            bash scripts/deploy_ifw_repositories.sh "$target" "dist/ifw_repo/$target"
            uv run --no-sync python packaging/verify_deployment.py desktop \
              --repository "dist/ifw_repo/$target" --platform "$target" \
              --remote-url "https://api.pornfetch.to/repo/$target/"
          done

      - name: Download Installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: IFW_installer_*
          path: dist/installers
          merge-multiple: true

      - name: Publish Standalone Installers
        shell: bash
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          shopt -s nullglob
          for file in dist/installers/*; do
            if [ -f "$file" ]; then
              fname=$(basename "$file")
              curl -f -sS -X POST \
                -H "X-CI-TOKEN: $CI_TOKEN" \
                -H "X-CI-Filename: $fname" \
                --data-binary @"$file" \
                https://api.pornfetch.to/ci/deploy/download
            fi
          done

  # ==========================================
  # 7. DEPLOY SIGNED CLI UPDATES
  # ==========================================
  deploy-cli-updates:
    name: Deploy CLI Updates
    needs: [validate, build-cli, build-cli-linux-x32, build-cli-linux-riscv64]
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.legal_review_complete &&
      (inputs.deploy_cli_updates || inputs.create_release) && needs.validate.result == 'success' && needs.build-cli.result == 'success'
    runs-on: ubuntu-latest
    environment: beta
    concurrency:
      group: cli-update-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install publishing dependencies
        run: uv sync --locked --no-dev

      - name: Download CLI Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: PornFetch_*_CLI_*
          path: dist/cli_artifacts
          # The publisher uses each artifact directory's name to select its TUF target.
          merge-multiple: false

      - name: Build signed CLI update repository
        shell: bash
        env:
          CLI_UPDATE_SIGNING_KEY: ${{ secrets.CLI_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLI_UPDATE_SIGNING_KEY"
          umask 077
          SIGNING_KEY_FILE=$(mktemp "$RUNNER_TEMP/cli-online.XXXXXX.pem")
          trap 'rm -f "$SIGNING_KEY_FILE"' EXIT
          printf '%s\n' "$CLI_UPDATE_SIGNING_KEY" > "$SIGNING_KEY_FILE"
          chmod 600 "$SIGNING_KEY_FILE"
          unset CLI_UPDATE_SIGNING_KEY
          APP_VERSION=$(uv run --no-sync python -c 'from src.shared.version import __version__; print(__version__)')
          uv run --no-sync python packaging/publish_cli_updates.py \
            --artifacts dist/cli_artifacts \
            --remote-url https://api.pornfetch.to/repo/cli/ \
            --output dist/cli_tuf \
            --private-key "$SIGNING_KEY_FILE" \
            --version "$APP_VERSION.${{ github.run_number }}"

      - name: Deploy CLI TUF Repo
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          bash scripts/deploy_cli_updates.sh dist/cli_tuf

      - name: Verify published CLI repository
        run: uv run --no-sync python packaging/verify_deployment.py cli --repository dist/cli_tuf --remote-url https://api.pornfetch.to/repo/cli/

  # ==========================================
  # 8. PUBLISH RELEASE (TAGS & DISPATCH)
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    needs: [validate, build-gui, build-cli, build-macos-universal, deploy-repositories, deploy-cli-updates]
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.create_release && inputs.legal_review_complete &&
      needs.validate.result == 'success' && needs.build-gui.result == 'success' && needs.build-cli.result == 'success' &&
      needs.build-macos-universal.result == 'success' &&
      needs.deploy-repositories.result == 'success' && needs.deploy-cli-updates.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: all_artifacts

      - name: Prepare Release Assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist_release
          shopt -s nullglob
          for artifact_dir in all_artifacts/*; do
            artifact_name="${artifact_dir##*/}"
            [[ "$artifact_name" == IFW_repo_* ]] && continue
            # Artifact downloads reset permissions; restore them before making release ZIPs.
            for file in "$artifact_dir"/*; do
              [[ -f "$file" ]] || continue
              name="${file##*/}"
              if [[ ( "$artifact_name" == *_CLI_* && "$name" == "$artifact_name" ) ||
                    "$name" == pocketbase || "$name" == PornFetch_linux_GUI_*.bin ||
                    "$name" == *_Setup.run ]]; then
                chmod +x "$file"
              fi
            done
            (cd "$artifact_dir" && zip -q -r "$GITHUB_WORKSPACE/dist_release/$artifact_name.zip" .)
            for file in "$artifact_dir"/*; do
              [[ -f "$file" ]] || continue
              name="${file##*/}"
              [[ "$name" == pocketbase* ]] && continue
              if [[ -e "dist_release/$name" ]]; then
                echo "Duplicate release asset: $name" >&2
                exit 1
              fi
              cp "$file" "dist_release/$name"
            done
          done
          echo "### Collected Release Assets:"
          ls -lh dist_release/

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$TAG_NAME" dist_release/* \
              --title "Porn Fetch $TAG_NAME" \
              --prerelease \
              --notes "3.9 beta build. The crypto sandbox checkout is a test: no real transaction takes place and no money is processed." \
              --verify-tag
          else
            RELEASE_TAG="build-${{ github.run_number }}-${{ github.sha }}"
            gh release create "$RELEASE_TAG" dist_release/* \
              --title "Porn Fetch Build (${{ github.sha }})" \
              --notes "3.9 beta build. The crypto sandbox checkout is a test: no real transaction takes place and no money is processed." \
              --prerelease \
              --target "$COMMIT_SHA" \
              --draft=false
          fi
