[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "Porn_Fetch"
dynamic = ["version"]
requires-python = ">=3.14,<3.15"
authors = [
    { name = "Johannes Habel", email = "EchterAlsFake@proton.me" },
]
description = "A downloader for adult media content"
readme = { file = "README.md", content-type = "text/markdown" }
license = "LicenseRef-Porn-Fetch-Source-Available-1.0"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "browser-cookie3>=0.20.1",
    "cryptography",
    "curl-cffi",
    "eaf-base-api[hls]>=4.2.2",
    "platformdirs>=4.3",
    "python-dateutil",
    "questionary>=2.1.1",
    "rich",
    "tuf>=7,<8",
    "unofficial-api-for-beeg>=1.7.3",
    "unofficial-api-for-empflix>=1.0",
    "unofficial-api-for-eporner>=2.4.3",
    "unofficial-api-for-pornhub>=5.4.5",
    "unofficial-api-for-porntrex>=1.8.2",
    "unofficial-api-for-redtube>=1.4.3",
    "unofficial-api-for-spankbang>=2.4.3",
    "unofficial-api-for-thumbzilla>=1.4.2",
    "unofficial-api-for-tnaflix>=1.0",
    "unofficial-api-for-tube8>=1.3.2",
    "unofficial-api-for-xfreehd>=1.7.3",
    "unofficial-api-for-xhamster>=2.6.3",
    "unofficial-api-for-xnxx>=2.4.3",
    "unofficial-api-for-xvideos>=2.5.2",
    "unofficial-api-for-youporn>=1.8.2",
]

[project.scripts]
porn-fetch-cli = "src.cli.batch:main"

[project.gui-scripts]
porn-fetch = "src.backend.application:main"

[project.optional-dependencies]
gui = [
    "PySide6",
    "certifi",
    "pydivert>=3.1.3; sys_platform == 'linux' or (sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64'))",
    "pywin32; sys_platform == 'win32'",
    "rich-argparse>=1.8.0",
    "truststore",
]
build = [
    "pip",
    "pyinstaller",
]
desktop-build = [
    "nuitka==4.1.1",
    "ordered-set",
    "zstandard",
    "patchelf; sys_platform == 'linux'",
]
android-build = [
    "jinja2",
    "pkginfo",
    "tqdm",
]

[dependency-groups]
dev = [
    "coverage[toml]",
    "pip-audit",
    "pyright",
    "ruff",
]

[tool.hatch.version]
path = "src/shared/version.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
exclude = ["src/tests/**"]

[tool.hatch.build.targets.wheel.force-include]
"docs/url-routing-audit/profile-fixtures.json" = "src/backend/profile_fixtures.json"

[tool.ruff]
line-length = 120
extend-exclude = [
    "src/frontend/UI/resources.py",
    "vendor",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"src/tests/**" = ["E402"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
include = [
    "src/shared",
    "src/database",
    "src/licensing/service.py",
    "src/cli/providers.py",
    "src/cli/settings.py",
]
exclude = [
    "src/frontend/UI/resources.py",
    "src/database/bridge.py",
    "src/shared/metadata.py",
]
reportMissingTypeStubs = false
reportMissingImports = false
reportMissingModuleSource = false
reportAttributeAccessIssue = false
reportArgumentType = false
reportCallIssue = false
reportPrivateImportUsage = false


[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/frontend/UI/resources.py",
    "src/tests/*",
    "src/cli/selftest/*",
    "src/backend/diagnostics.py",
    "src/backend/sni_fragment_proxy_lite.py",
    "src/backend/sni_fragment_proxy_strict.py",
]

[tool.coverage.report]
skip_covered = true
show_missing = true

